<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestionHôtel - Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Scrollbar personnalisée */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }
    </style>
</head>
<body class="bg-[#eef0f3] text-gray-800 h-screen overflow-hidden flex p-3 gap-3">

    <!-- 1. BARRE LATÉRALE ICONIQUE (Ultra-gauche) -->
    <aside id="sidebar-iconic" class="w-16 bg-[#e4e7ec] rounded-[2.5rem] flex flex-col items-center py-6 justify-between shadow-sm">
        <!-- Logo / Étoile -->
        <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm cursor-pointer hover:scale-105 transition">
            <svg class="w-5 h-5 text-black" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l2.4 7.4h7.6l-6 4.6 2.3 7-6.3-4.6-6.3 4.6 2.3-7-6-4.6h7.6z"/></svg>
        </div>

        <!-- Icônes de navigation principale -->
        <div class="flex flex-col space-y-6 items-center">
            <!-- Accueil -->
            <button id="nav-home" class="p-2.5 text-gray-500 hover:text-black transition" title="Tableau de bord">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            </button>
            <!-- Réservations -->
            <button id="nav-reservations" class="p-2.5 text-gray-500 hover:text-black transition relative" title="Réservations">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                <span id="reservations-badge" class="absolute top-1 right-1 w-2 h-2 bg-pink-500 rounded-full hidden"></span>
            </button>
            <!-- Chambres -->
            <button id="nav-rooms" class="p-2.5 text-gray-500 hover:text-black transition" title="Chambres">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
            </button>
            <!-- Facturation -->
            <button id="nav-billing" class="p-2.5 text-gray-500 hover:text-black transition" title="Facturation">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l4-2 4 2 4-2 4 2z"/></svg>
            </button>
        </div>

        <!-- Profil / Bas -->
        <div class="flex flex-col space-y-4 items-center">
            <button id="nav-settings" class="p-2.5 text-gray-500 hover:text-black transition" title="Paramètres">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </button>
            <div class="w-8 h-8 rounded-full bg-gray-400 overflow-hidden">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Avatar" class="w-full h-full object-cover">
            </div>
        </div>
    </aside>

    <!-- 2. MENU ET NAVIGATION SECONDAIRE (Panneau latéral extensible) -->
    <nav id="secondary-nav" class="w-80 bg-[#e4e7ec] rounded-[2.5rem] flex flex-col p-6 shadow-sm justify-between">
        <div>
            <!-- En-tête Menu -->
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center space-x-2">
                    <span class="text-black text-lg">✦</span>
                    <span class="font-bold text-lg tracking-tight">Menu Hôtel</span>
                </div>
            </div>

            <!-- Liens principaux -->
            <div id="main-menu" class="space-y-1 text-sm font-medium">
                <!-- Généré dynamiquement par navigation.js -->
            </div>
        </div>

        <!-- Section Catégories / Filtres rapides -->
        <div class="border-t border-gray-300/60 pt-4">
            <div class="flex items-center justify-between text-xs font-bold text-gray-500 uppercase tracking-wider mb-3 px-2">
                <span>Statut Chambres (<span id="total-rooms">0</span>)</span>
                <span>📁</span>
            </div>
            <div id="room-status-filters" class="space-y-1 text-sm">
                <!-- Généré dynamiquement -->
            </div>
        </div>
    </nav>

    <!-- 3. ZONE DE CONTENU PRINCIPAL -->
    <main id="main-content" class="flex-1 bg-white rounded-[2.5rem] p-8 shadow-sm flex flex-col overflow-hidden">
        <!-- Le contenu sera injecté dynamiquement par les components -->
    </main>

    <!-- Scripts ES Modules -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
